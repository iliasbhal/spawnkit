version: "3"
name: spawnkit
services:
  postgres:
    image: postgres
    env_file:
      - ../.env
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data

  redis:
    image: redis
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - ./volumes/redis:/data
